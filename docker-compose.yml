services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: doctor
      POSTGRES_PASSWORD: translator
      POSTGRES_DB: doctor_translator
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doctor -d doctor_translator"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
